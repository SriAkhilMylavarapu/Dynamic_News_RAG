[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "newsrag"
version = "2.0.0"
description = "Ask questions about today's news across many outlets, with cited answers."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "trafilatura>=1.12",
  "chromadb>=1.0",
  "fastembed>=0.5",
  "numpy>=1.26",
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
newsrag = "newsrag.cli:main"

[tool.setuptools]
packages = ["newsrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
